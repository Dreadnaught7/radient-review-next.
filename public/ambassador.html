<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consonance Ambassador Intake</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:28px 18px 50px}.brand{font-weight:800;letter-spacing:.08em;font-size:13px}.card{background:white;border:1px solid #deded8;border-radius:18px;padding:24px;margin-top:18px;box-shadow:0 8px 28px rgba(0,0,0,.04)}h1{font-size:30px;line-height:1.08;margin:8px 0 10px}p{color:#555;line-height:1.5}.ref{font-size:13px;color:#666;background:#f3f3ef;border-radius:999px;padding:7px 10px;display:none;margin-bottom:10px}label{display:block;font-size:13px;font-weight:650;margin:16px 0 6px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #cfcfc8;border-radius:10px;background:#fff;font:inherit}textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{margin-top:20px;width:100%;padding:14px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:750;font-size:15px}.fine{font-size:12px;color:#777;margin-top:14px}.status{display:none;padding:14px;border-radius:10px;margin:16px 0}.ok{display:block;background:#eef8ef;border:1px solid #cce8cf;color:#255b2d}.err{display:block;background:#fff1f1;border:1px solid #efcccc;color:#7a2222}@media(max-width:620px){.grid{grid-template-columns:1fr}h1{font-size:27px}.card{padding:20px}}</style></head><body><div class="wrap"><div class="brand">CONSONANCE</div><div class="card"><div id="refBadge" class="ref"></div><h1>Tell us what you need.</h1><p>Provide a concise description of the problem, objective, or intelligence need. We will route it to the appropriate service.</p><div id="status" class="status"></div><form id="intakeForm"><div class="grid"><div><label>Name</label><input name="full_name" required></div><div><label>Email</label><input name="email" type="email" required></div></div><div class="grid"><div><label>Company / Organization</label><input name="company"></div><div><label>Website</label><input name="website" type="url" placeholder="https://"></div></div><div class="grid"><div><label>Country / Jurisdiction</label><input name="country_jurisdiction"></div><div><label>Service</label><select id="service" name="service_slug" required><option value="">Select a service</option><option value="commercial-intelligence">Commercial Intelligence</option><option value="business-organization">Business Organization</option><option value="executive-production-intelligence">Executive Production Intelligence</option><option value="company-research">Company Research</option><option value="market-mapping">Market Mapping</option><option value="competitive-analysis">Competitive Analysis</option><option value="lead-qualification">Lead Qualification</option><option value="executive-intelligence">Executive Intelligence</option><option value="research-reports">Research Reports</option><option value="operational-analysis">Operational Analysis</option><option value="content-intelligence">Content Intelligence</option></select></div></div><label>Problem / Goal</label><textarea name="problem_goal" required placeholder="What are you trying to understand, improve, organize, investigate, or decide?"></textarea><div class="grid"><div><label>Budget</label><select name="budget_band"><option value="">Select</option><option>Under $500</option><option>$500–$1,500</option><option>$1,500–$5,000</option><option>$5,000–$15,000</option><option>$15,000+</option></select></div><div><label>Timeline</label><select name="timeline"><option value="">Select</option><option>Urgent / 48 hours</option><option>Within 1 week</option><option>Within 1 month</option><option>Planning / exploratory</option></select></div></div><label>Preferred contact</label><select name="preferred_contact"><option value="email" selected>Email</option></select><button id="submitBtn" class="btn" type="submit">Submit intake</button><div class="fine">Referral attribution is used to credit the ambassador who introduced you. Submitting this form does not obligate you to purchase.</div></form></div></div><script>const ENDPOINT='https://gvpbolcmawwjufuvjmqa.supabase.co/functions/v1/ambassador-intake';const q=new URLSearchParams(location.search);const ref=(q.get('ref')||'').toLowerCase();const channel=q.get('channel')||'ambassador';const campaign=q.get('campaign')||'';const svc=q.get('service')||'';const badge=document.getElementById('refBadge');if(ref==='kajuan'||ref==='shan'){badge.textContent='Referred by '+(ref==='kajuan'?'Kajuan':'Shan');badge.style.display='inline-block'}if(svc)document.getElementById('service').value=svc;let referralId='';async function recordVisit(){if(!ref)return;try{const r=await fetch(ENDPOINT+'?'+new URLSearchParams({ref,channel,campaign,service:svc,format:'json'}),{headers:{Accept:'application/json'}});const j=await r.json();referralId=j.referral_id||''}catch(e){}}recordVisit();document.getElementById('intakeForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submitBtn');const st=document.getElementById('status');btn.disabled=true;btn.textContent='Submitting…';const fd=new FormData(e.currentTarget);fd.set('ref',ref);fd.set('channel',channel);fd.set('campaign',campaign);fd.set('referral_id',referralId);try{const r=await fetch(ENDPOINT,{method:'POST',headers:{Accept:'application/json'},body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'Unable to submit');st.className='status ok';st.innerHTML='<strong>Intake received.</strong><br>Reference: '+j.intake_reference;e.currentTarget.reset();if(svc)document.getElementById('service').value=svc;window.scrollTo({top:0,behavior:'smooth'})}catch(err){st.className='status err';st.textContent='Unable to submit intake. Please try again.'}finally{btn.disabled=false;btn.textContent='Submit intake'}});</script></body></html>
