<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="The Radient Review — independent analysis, clear context, open questions." />
    <link rel="alternate" type="application/rss+xml" title="The Radient Review RSS" href="/feed.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://public-api.wordpress.com" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/premium.css" />
    <style>
      .article > .media:has(.signal) { display: none; }
      .pilot-deposit-cta { margin: 2rem 0 0; padding: 1.35rem; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; background: rgba(255,255,255,.04); }
      .pilot-deposit-cta h2 { margin: 0 0 .55rem; }
      .pilot-deposit-cta p { margin: 0 0 1rem; }
      .pilot-deposit-cta a { display: inline-flex; align-items: center; justify-content: center; padding: .8rem 1rem; border-radius: 999px; background: #fff; color: #07090d; font-weight: 700; text-decoration: none; }
    </style>
    <title>The Radient Review</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      (() => {
        const routeName = () => (window.location.hash || '#/').replace(/^#\/?/, '') || 'home';
        const syncRoute = () => {
          const route = routeName();
          if (route === 'page/research-services') {
            window.location.replace('#/services');
            return;
          }
          document.body.dataset.route = route;
        };

        const addWorkLink = () => {
          const nav = document.querySelector('.site-header nav');
          if (!nav || nav.querySelector('[data-work-results]')) return false;
          const link = document.createElement('a');
          link.href = '/work/';
          link.textContent = 'Work';
          link.setAttribute('data-work-results', 'true');
          const about = [...nav.querySelectorAll('a')].find(a => a.textContent?.trim() === 'About');
          about ? nav.insertBefore(link, about) : nav.appendChild(link);
          return true;
        };

        const syncPilotDeposit = () => {
          const isPilotPage = window.location.hash === '#/page/commercial-cleaning-pilot';
          const existing = document.querySelector('[data-pilot-deposit]');
          if (!isPilotPage) {
            if (existing) existing.remove();
            return false;
          }
          const article = document.querySelector('.static-page');
          if (!article || existing) return !!existing;
          const cta = document.createElement('section');
          cta.className = 'pilot-deposit-cta';
          cta.setAttribute('data-pilot-deposit', 'true');
          cta.innerHTML = '<p class="eyebrow accent">PILOT DEPOSIT OPTION</p><h2>Start with a $250 deposit</h2><p>The $250 deposit activates the commercial-cleaning pilot. The remaining $250 is due before release of the complete unredacted deliverable.</p><a href="https://buy.stripe.com/8x29AS46Y2mbg6o3NK0sU05" target="_blank" rel="noopener noreferrer">Pay $250 Deposit</a>';
          article.appendChild(cta);
          return true;
        };

        const sync = () => { syncRoute(); addWorkLink(); syncPilotDeposit(); };
        sync();
        window.addEventListener('hashchange', sync);
        const observer = new MutationObserver(sync);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
