<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="The Radient Review — independent analysis, clear context, open questions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://public-api.wordpress.com" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="%BASE_URL%site-overrides.css" />
    <title>The Radient Review</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const build = 'rr-2026-08-26-public-overrides-v4';
        if (sessionStorage.getItem('radient-build') !== build) {
          Object.keys(sessionStorage)
            .filter(key => key.startsWith('radient-'))
            .forEach(key => sessionStorage.removeItem(key));
          sessionStorage.setItem('radient-build', build);
        }
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
