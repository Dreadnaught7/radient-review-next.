<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="The Radient Review — independent analysis, clear context, open questions." />
    <link rel="alternate" type="application/rss+xml" title="The Radient Review RSS" href="/feed.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://public-api.wordpress.com" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Do not reserve a large decorative hero slot on report pages when no real image exists. */
      .article > .media:has(.signal) { display: none; }
    </style>
    <title>The Radient Review</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      (() => {
        const addWorkLink = () => {
          const nav = document.querySelector('.site-header nav');
          if (!nav || nav.querySelector('[data-work-results]')) return false;
          const link = document.createElement('a');
          link.href = '/work/';
          link.textContent = 'Work';
          link.setAttribute('data-work-results', 'true');
          const about = [...nav.querySelectorAll('a')].find(a => a.textContent?.trim() === 'About');
          about ? nav.insertBefore(link, about) : nav.appendChild(link);
          return true;
        };
        if (!addWorkLink()) {
          const observer = new MutationObserver(() => { if (addWorkLink()) observer.disconnect(); });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </body>
</html>
